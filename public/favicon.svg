<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <!-- Cerebro -->
  <path
    d="M32 8c-8 0-14 3-17 8-2 3-3 7-2 11 0 2-1 4-3 5-1 1-2 3-2 5 0 3 2 5 5 6 1 0 2 1 3 3 1 3 4 5 7 6 2 1 4 1 6 0h4c2 1 4 1 6 0 3-1 6-3 7-6 1-2 2-3 3-3 3-1 5-3 5-6 0-2-1-4-2-5-2-1-3-3-3-5 1-4 0-8-2-11-3-5-9-8-17-8z"
    fill="url(#brainGrad)"
  />
  <!-- Surco central -->
  <path
    d="M32 12v40"
    fill="none" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"
  />
  <!-- Circunvoluciones izquierda -->
  <path
    d="M18 20c3-1 7 0 9 2M15 28c4-1 9 0 12 2M17 36c3 0 7 1 10 3"
    fill="none" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"
  />
  <!-- Circunvoluciones derecha -->
  <path
    d="M46 20c-3-1-7 0-9 2M49 28c-4-1-9 0-12 2M47 36c-3 0-7 1-10 3"
    fill="none" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"
  />
  <!-- 5 puntos sensoriales: Vista, Oído, Olfato, Gusto, Tacto -->
  <circle cx="14" cy="16" r="3.5" fill="#f59e0b" opacity="0.9"/> <!-- Vista (amarillo) -->
  <circle cx="50" cy="16" r="3.5" fill="#3b82f6" opacity="0.9"/> <!-- Oído (azul) -->
  <circle cx="32" cy="6"  r="3"   fill="#10b981" opacity="0.9"/> <!-- Olfato (verde) -->
  <circle cx="14" cy="44" r="3.5" fill="#ef4444" opacity="0.9"/> <!-- Gusto (rojo) -->
  <circle cx="50" cy="44" r="3.5" fill="#f97316" opacity="0.9"/> <!-- Tacto (naranja) -->
  <!-- Líneas de señal sensorial al cerebro -->
  <line x1="14" y1="16" x2="22" y2="20" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
  <line x1="50" y1="16" x2="42" y2="20" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="32" y1="6"  x2="32" y2="12" stroke="#10b981" stroke-width="1.2" opacity="0.6"/>
  <line x1="14" y1="44" x2="22" y2="38" stroke="#ef4444" stroke-width="1.2" opacity="0.6"/>
  <line x1="50" y1="44" x2="42" y2="38" stroke="#f97316" stroke-width="1.2" opacity="0.6"/>
</svg>
